name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Compile, validate manifests, scan for secrets
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Compile Python sources
        run: python -m compileall -q agents webapp

      - name: Validate azd manifests
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import sys
          import yaml

          paths = [
              "agents/extraction-agent/azure.yaml",
              "agents/sow-builder-agent/azure.yaml",
          ]
          for path in paths:
              with open(path, encoding="utf-8") as handle:
                  doc = yaml.safe_load(handle)
              assert "services" in doc, f"{path}: missing services"
              assert "infra" in doc, f"{path}: missing infra"
              print(f"OK  {path}  services={list(doc['services'])}")
          PY

      - name: Scan for obvious secret patterns
        run: |
          python - <<'PY'
          import os
          import re
          import sys

          patterns = [
              ("JWT bearer token", re.compile(r"eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{10,}")),
              ("Blob SAS signature", re.compile(r"[?&]sig=[A-Za-z0-9%+/=]{20,}")),
              ("Hardcoded service key", re.compile(
                  r"(?i)(api[_-]?key|search[_-]?key)\s*[:=]\s*[\"']?[A-Za-z0-9+/]{32,}")),
          ]
          skip_dirs = {".git", ".venv", "__pycache__", "node_modules"}
          hits = []

          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in skip_dirs]
              for name in files:
                  path = os.path.join(root, name)
                  try:
                      with open(path, encoding="utf-8") as handle:
                          text = handle.read()
                  except (UnicodeDecodeError, OSError):
                      continue
                  for label, pattern in patterns:
                      for match in pattern.finditer(text):
                          fragment = match.group(0)
                          if "<" in fragment or "..." in fragment or "EXAMPLE" in fragment.upper():
                              continue
                          hits.append(f"{path}: {label}")

          if hits:
              print("Potential secrets detected:")
              print("\n".join(hits))
              sys.exit(1)
          print("No obvious secret patterns found.")
          PY
