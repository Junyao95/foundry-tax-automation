# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
#
# azd manifest for the Extraction Agent. Deploy from THIS directory:
#   azd auth login && azd up
#
# SECURITY: no credentials in this file. Secrets are injected from environment
# variables / a gitignored .env at deploy time. See docs/configuration.md.

requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.9'

name: extraction-agent

services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-4.1-mini
        model:
          format: OpenAI
          name: gpt-4.1-mini
          version: '2024-07-18'
        sku:
          name: GlobalStandard
          capacity: 10

  extraction-agent:
    host: azure.ai.agent
    kind: hosted
    project: src
    language: python
    metadata:
      tags:
        - Agent Framework
        - Azure AI AgentServer
        - Responses Protocol
        - Document Intelligence
    name: extraction-agent
    description: >-
      Extracts employee compensation line items and the employee name from
      PDF or Excel documents supplied by URL.
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
      dependencyResolution: remote_build
    uses:
      - ai-project
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      PYTHONNOUSERSITE: "1"
      AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-4.1-mini
      DOCUMENTINTELLIGENCE_ENDPOINT: ${DOCUMENTINTELLIGENCE_ENDPOINT}
      DOCUMENTINTELLIGENCE_API_KEY: ${DOCUMENTINTELLIGENCE_API_KEY}
    container:
      resources:
        cpu: '0.5'
        memory: 1.0Gi

infra:
  provider: microsoft.foundry
