# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
#
# azd manifest for the SOW Builder Agent. Deploy from THIS directory:
#   azd auth login && azd up
#
# SECURITY: no credentials in this file. Secrets are injected from environment
# variables / a gitignored .env at deploy time. See docs/configuration.md.

requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.9'

name: sow-builder-agent

services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-4.1-mini
        model:
          format: OpenAI
          name: gpt-4.1-mini
          version: '2024-07-18'
        sku:
          name: GlobalStandard
          capacity: 10

  sow-builder-agent:
    host: azure.ai.agent
    kind: hosted
    project: src
    language: python
    metadata:
      tags:
        - Agent Framework
        - Azure AI AgentServer
        - Responses Protocol
        - Human-in-the-loop
    name: sow-builder-agent
    description: >-
      Builds a proposed Schedule of Work from extracted compensation data and
      flags items absent from the prior year for human review.
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
      dependencyResolution: remote_build
    uses:
      - ai-project
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      PYTHONNOUSERSITE: "1"
      AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-4.1-mini
      AZURE_SEARCH_ENDPOINT: ${AZURE_SEARCH_ENDPOINT}
      AZURE_SEARCH_KEY: ${AZURE_SEARCH_KEY}
      AZURE_SEARCH_INDEX_NAME: prior-year-sows
    container:
      resources:
        cpu: '0.5'
        memory: 1.0Gi

infra:
  provider: microsoft.foundry
