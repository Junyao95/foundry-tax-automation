<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="End-to-end architecture of the Foundry tax automation workflow">
  <title>Foundry Tax Automation - end-to-end architecture</title>
  <desc>A compensation document flows through two Foundry hosted agents, a human approval step in Streamlit, and a tax computation agent that produces a PDF package.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7280"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="420" fill="#FFFFFF"/>

  <text x="24" y="30" font-size="15" font-weight="700" fill="#111827">End-to-end workflow</text>
  <text x="24" y="48" font-size="11" fill="#6B7280">Two Microsoft Foundry hosted agents · OpenAI Responses protocol · DefaultAzureCredential</text>

  <!-- Row 1 boxes -->
  <rect x="24" y="60" width="236" height="86" rx="10" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="142" y="92" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">Compensation file</text>
  <text x="142" y="112" font-size="11" fill="#4B5563" text-anchor="middle">PDF or XLSX via short-lived SAS URL</text>
  <text x="142" y="130" font-size="10" fill="#6B7280" text-anchor="middle">Step 0 · input</text>

  <rect x="332" y="60" width="236" height="86" rx="10" fill="#E8F1FC" stroke="#0078D4" stroke-width="1.5"/>
  <text x="450" y="92" font-size="14" font-weight="700" fill="#0F3D6E" text-anchor="middle">extraction-agent</text>
  <text x="450" y="112" font-size="11" fill="#374151" text-anchor="middle">Foundry hosted · Responses v2</text>
  <text x="450" y="130" font-size="10" fill="#1D4ED8" text-anchor="middle">Step 1 · hosted agent</text>

  <rect x="640" y="60" width="236" height="86" rx="10" fill="#E8F1FC" stroke="#0078D4" stroke-width="1.5"/>
  <text x="758" y="92" font-size="14" font-weight="700" fill="#0F3D6E" text-anchor="middle">sow-builder-agent</text>
  <text x="758" y="112" font-size="11" fill="#374151" text-anchor="middle">Foundry hosted · Responses v2</text>
  <text x="758" y="130" font-size="10" fill="#1D4ED8" text-anchor="middle">Step 2 · hosted agent</text>

  <!-- Row 1 arrows -->
  <line x1="264" y1="103" x2="326" y2="103" stroke="#6B7280" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="295" y="88" font-size="9" fill="#6B7280" text-anchor="middle">SAS URL</text>
  <line x1="572" y1="103" x2="634" y2="103" stroke="#6B7280" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="603" y="88" font-size="9" fill="#6B7280" text-anchor="middle">JSON</text>

  <!-- Row 1 service chips -->
  <rect x="24" y="162" width="236" height="28" rx="14" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="142" y="180" font-size="10" fill="#4B5563" text-anchor="middle">Azure Blob Storage</text>
  <rect x="332" y="162" width="236" height="28" rx="14" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="450" y="180" font-size="10" fill="#4B5563" text-anchor="middle">Document Intelligence · pandas</text>
  <rect x="640" y="162" width="236" height="28" rx="14" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="758" y="180" font-size="10" fill="#4B5563" text-anchor="middle">Azure AI Search · prior-year SOW</text>

  <!-- Vertical connector -->
  <line x1="758" y1="150" x2="758" y2="246" stroke="#6B7280" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="770" y="216" font-size="9" fill="#6B7280">proposed SOW + REQUIRES_HUMAN_REVIEW</text>

  <!-- Row 2 boxes -->
  <rect x="640" y="252" width="236" height="86" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="758" y="284" font-size="14" font-weight="700" fill="#7C2D12" text-anchor="middle">Streamlit web app</text>
  <text x="758" y="304" font-size="11" fill="#4B5563" text-anchor="middle">Human-in-the-loop approval</text>
  <text x="758" y="322" font-size="10" fill="#B45309" text-anchor="middle">Step 3 · HARD STOP until approved</text>

  <rect x="332" y="252" width="236" height="86" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="450" y="284" font-size="14" font-weight="700" fill="#4C1D95" text-anchor="middle">Tax Computation Agent</text>
  <text x="450" y="304" font-size="11" fill="#4B5563" text-anchor="middle">In-process FoundryChatClient</text>
  <text x="450" y="322" font-size="10" fill="#6D28D9" text-anchor="middle">Step 4 · client-side agent</text>

  <rect x="24" y="252" width="236" height="86" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="142" y="284" font-size="14" font-weight="700" fill="#14532D" text-anchor="middle">Tax package</text>
  <text x="142" y="304" font-size="11" fill="#4B5563" text-anchor="middle">Structured JSON + A4 PDF</text>
  <text x="142" y="322" font-size="10" fill="#15803D" text-anchor="middle">Step 5 · deliverable</text>

  <!-- Row 2 arrows (right to left) -->
  <line x1="636" y1="295" x2="574" y2="295" stroke="#6B7280" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="605" y="280" font-size="9" fill="#6B7280" text-anchor="middle">approved SOW</text>
  <line x1="328" y1="295" x2="266" y2="295" stroke="#6B7280" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="297" y="280" font-size="9" fill="#6B7280" text-anchor="middle">result</text>

  <!-- Row 2 service chips -->
  <rect x="640" y="350" width="236" height="28" rx="14" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="758" y="368" font-size="10" fill="#4B5563" text-anchor="middle">webapp/app.py · 3-step wizard</text>
  <rect x="332" y="350" width="236" height="28" rx="14" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="450" y="368" font-size="10" fill="#4B5563" text-anchor="middle">Azure OpenAI · gpt-4.1-mini</text>
  <rect x="24" y="350" width="236" height="28" rx="14" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="142" y="368" font-size="10" fill="#4B5563" text-anchor="middle">FPDF2 · audit trail included</text>

  <line x1="24" y1="396" x2="876" y2="396" stroke="#E5E7EB"/>
  <text x="24" y="412" font-size="10" fill="#9CA3AF">Blue = Foundry hosted agents · Amber = human control point · Purple = client-side agent · Green = output</text>
</svg>
